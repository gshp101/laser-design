name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package
        run: python -m pip install -e ".[plot,gui,test]"
      - name: Run tests
        run: python -m pytest -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and docs tools
        run: python -m pip install -e ".[plot,gui,docs]"
      - name: Build documentation (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Run the tutorial code
        env:
          MPLBACKEND: Agg
        run: |
          python - <<'PY'
          import re
          src = open("docs/tutorial.md").read()
          exec(compile("\n".join(re.findall(r"```python\n(.*?)```", src, re.S)), "tutorial", "exec"))
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
