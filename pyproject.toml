[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laserdesign"
version = "0.1.0"
description = "Physics library for designing diode- and laser-pumped solid state lasers (CW, Q-switched, mode-locked)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joe" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
gui = ["PySide6>=6.5", "matplotlib>=3.7"]
docs = ["sphinx>=7", "myst-parser>=2", "furo", "numpydoc"]
test = ["pytest>=7"]

[project.gui-scripts]
laserdesign-gui = "laserdesign.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
