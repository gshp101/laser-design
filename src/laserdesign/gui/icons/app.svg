    <linearGradient id="mirror" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9eef5"/><stop offset="1" stop-color="#9aa8bb"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff4d4d" stop-opacity=".45"/><stop offset=".6" stop-color="#ff4d4d" stop-opacity=".12"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></radialGradient>
